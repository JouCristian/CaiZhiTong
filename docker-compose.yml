services:
  postgres:
    image: postgres:15.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: caizhitong
      POSTGRES_USER: ${DB_USERNAME:?Run scripts/setup-local.ps1 first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d caizhitong"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:

