name: 改进建议
description: 先说明实际需求，再讨论后续版本范围。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        v0.7.0 已冻结，新需求通过讨论决定是否进入后续版本。
        提交建议不代表已承诺实现；请勿附真实用户资料或私密平台配置。
  - type: textarea
    id: problem
    attributes:
      label: 谁遇到了什么问题
      description: 描述使用场景与当前限制，不只填写一个组件或技术名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望获得的行为
      description: 给出具体输入 / 操作和预期结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
  - type: textarea
    id: impact
    attributes:
      label: 权限、数据与兼容影响
      description: 是否影响 Demo 隔离、库存 / 金额口径、迁移、依赖、移动端或部署；未知可明确写未知。
  - type: checkboxes
    id: participation
    attributes:
      label: 参与意向（可选）
      options:
        - label: 愿意在范围讨论后提交实现 PR。
        - label: 愿意提供合成样本、验证或文档。
