name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: caizhitong
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: caizhitong_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caizhitong -d caizhitong_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/caizhitong_test
      TEST_DB_URL: jdbc:postgresql://localhost:5432/caizhitong_test
      DB_USERNAME: caizhitong
      DB_PASSWORD: ci-only-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B verify
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
      - name: Test credential-free availability checker
        run: node --test scripts/check-availability.test.mjs
      - name: Install isolated OAuth browser runtime
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Create isolated OAuth browser database
        run: docker exec "${{ job.services.postgres.id }}" psql -U caizhitong -d postgres -c 'CREATE DATABASE caizhitong_v070_demo_e2e_test'
      - name: Mock GitHub OAuth browser flow (desktop and mobile)
        run: bash scripts/test-oauth-ci.sh
        env:
          DB_URL: jdbc:postgresql://localhost:5432/caizhitong_v070_demo_e2e_test
      - name: Build backend Docker image
        run: docker build --tag caizhitong-backend:ci ./backend
      - name: Smoke Docker runtime within 512 MiB
        shell: bash
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          docker run -d --name caizhitong-ci-runtime --network host --memory 512m --memory-swap 512m \
            -e DB_URL -e DB_USERNAME -e DB_PASSWORD -e JWT_SECRET \
            -e SERVER_PORT=18080 -e DEMO_ENABLED=false -e BOOTSTRAP_ADMIN_ENABLED=false \
            -e STORAGE_MODE=local -e ALERT_SCAN_ENABLED=false -e MAIL_DISPATCH_ENABLED=false \
            -e GITHUB_OAUTH_ENABLED=true -e GITHUB_CLIENT_ID=ci-synthetic-client \
            -e GITHUB_CLIENT_SECRET=ci-synthetic-oauth-secret \
            -e GITHUB_REDIRECT_URI=https://backend.example.test/login/oauth2/code/github \
            -e PUBLIC_WEB_URL=https://frontend.example.test \
            caizhitong-backend:ci
          trap 'docker rm -f caizhitong-ci-runtime >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health > /tmp/caizhitong-health.json; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' caizhitong-ci-runtime)" != true ]; then
              docker logs caizhitong-ci-runtime
              exit 1
            fi
            sleep 2
          done
          python3 -c 'import json; assert json.load(open("/tmp/caizhitong-health.json"))["status"] == "UP"'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/auth/me)" = 401
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/demo/dashboard)" = 401
          curl --fail --silent http://127.0.0.1:18080/api/auth/oauth/config > /tmp/caizhitong-oauth.json
          python3 -c 'import json; assert json.load(open("/tmp/caizhitong-oauth.json"))["data"]["githubEnabled"] is True'
          curl --silent --dump-header /tmp/caizhitong-oauth-headers --output /dev/null \
            'http://127.0.0.1:18080/oauth2/authorization/github?challenge=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
          python3 - <<'PY'
          from urllib.parse import urlparse, parse_qs
          headers = open('/tmp/caizhitong-oauth-headers').read().splitlines()
          assert '302' in headers[0]
          location = next(h.split(': ', 1)[1] for h in headers if h.lower().startswith('location:'))
          url = urlparse(location)
          params = parse_qs(url.query)
          assert url.scheme == 'https' and url.netloc == 'github.com'
          assert params['redirect_uri'] == ['https://backend.example.test/login/oauth2/code/github']
          assert params['state'] and params['code_challenge_method'] == ['S256']
          PY
          test "$(docker inspect -f '{{.State.OOMKilled}}/{{.RestartCount}}' caizhitong-ci-runtime)" = false/0
          docker stats --no-stream --format '{{.MemUsage}}' caizhitong-ci-runtime
      - name: Compare startup at 0.1 CPU and 512 MiB (isolated database)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DB_URL: jdbc:postgresql://localhost:5432/caizhitong_startup_perf_test
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U caizhitong -d postgres -c 'CREATE DATABASE caizhitong_startup_perf_test'
          export JWT_SECRET="$(openssl rand -base64 48)"
          python3 scripts/profile-startup.py
      - name: Retain isolated startup measurements
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: isolated-startup-${{ github.run_id }}
          path: .runtime/startup-ci/
          retention-days: 30
          if-no-files-found: warn
