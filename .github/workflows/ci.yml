name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: caizhitong
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: caizhitong_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caizhitong -d caizhitong_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/caizhitong_test
      TEST_DB_URL: jdbc:postgresql://localhost:5432/caizhitong_test
      DB_USERNAME: caizhitong
      DB_PASSWORD: ci-only-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B verify
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
