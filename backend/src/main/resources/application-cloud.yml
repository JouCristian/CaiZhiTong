# Activate only on the cloud backend. DB/Flyway credentials remain environment values.
server:
  port: ${SERVER_PORT:${PORT:10000}}
  tomcat:
    threads:
      max: 24
      min-spare: 2
    max-connections: 200
    accept-count: 32
spring:
  datasource:
    hikari:
      schema: ${DB_SCHEMA:caizhitong}
      maximum-pool-size: ${DB_POOL_MAX:3}
  flyway:
    default-schema: ${DB_SCHEMA:caizhitong}
    schemas: ${DB_SCHEMA:caizhitong}
app:
  storage:
    mode: ${STORAGE_MODE:supabase}
