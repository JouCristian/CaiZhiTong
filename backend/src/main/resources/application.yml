server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 10m
      cookie:
        name: CZT_OAUTH_SESSION
        http-only: true
        same-site: lax
  error:
    include-message: never
spring:
  application:
    name: caizhitong
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:0}
      connection-timeout: 15000
      schema: ${DB_SCHEMA:public}
  flyway:
    enabled: true
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  version: 0.7.0
  oauth:
    github:
      enabled: ${GITHUB_OAUTH_ENABLED:false}
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:}
  storage:
    mode: ${STORAGE_MODE:local}
    root: ${STORAGE_ROOT:./.runtime/uploads}
    supabase:
      url: ${SUPABASE_URL:}
      bucket: ${SUPABASE_STORAGE_BUCKET:caizhitong-attachments}
      key: ${SUPABASE_STORAGE_KEY:}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  alerts:
    scan-enabled: ${ALERT_SCAN_ENABLED:true}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    recipients: ${MAIL_RECIPIENTS:}
    starttls: ${MAIL_STARTTLS:true}
    ssl: ${MAIL_SSL:false}
    dispatch-enabled: ${MAIL_DISPATCH_ENABLED:true}
  business-zone: ${BUSINESS_TIME_ZONE:Asia/Shanghai}
  public-web-url: ${PUBLIC_WEB_URL:}
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:7200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

