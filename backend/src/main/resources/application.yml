server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: caizhitong
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  storage:
    root: ${STORAGE_ROOT:./.runtime/uploads}
  alerts:
    scan-enabled: ${ALERT_SCAN_ENABLED:true}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    recipients: ${MAIL_RECIPIENTS:}
    starttls: ${MAIL_STARTTLS:true}
    ssl: ${MAIL_SSL:false}
    dispatch-enabled: ${MAIL_DISPATCH_ENABLED:true}
  business-zone: ${BUSINESS_TIME_ZONE:Asia/Shanghai}
  public-web-url: ${PUBLIC_WEB_URL:}
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:7200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

